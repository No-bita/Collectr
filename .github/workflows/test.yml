name: CI Test Suite & Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 18.x, 20.x ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install SQLite3 (Linux)
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Install Root & V2 Dependencies
        run: |
          npm install
          npm --prefix v2 install

      - name: Security & Secret Scan
        run: node scripts/scan-secrets.js

      - name: Run Test Suite (Strict Offline Isolation)
        env:
          NO_EXTERNAL_NETWORK: "true"
          MOCK_WHATSAPP: "true"
          MOCK_GEMINI: "true"
        run: npm run test:offline

      - name: Run Deep SQLite Schema Parity Tests
        run: node --test v2/tests/schema-parity.test.js
