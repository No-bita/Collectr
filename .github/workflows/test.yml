name: CI Test Suite & Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 20.x, 22.x ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            v2/package-lock.json

      - name: Ensure SQLite3
        run: which sqlite3 || (sudo apt-get update && sudo apt-get install -y sqlite3)

      - name: Install Root & V2 Dependencies
        run: |
          npm install
          npm --prefix v2 install

      - name: Security & Secret Scan
        run: npm run scan:secrets

      - name: Run Test Suite (Strict Offline Isolation)
        env:
          NO_EXTERNAL_NETWORK: "true"
          MOCK_WHATSAPP: "true"
          MOCK_GEMINI: "true"
        run: npm run test:offline
