<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign In — Collectrr OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #f4f6f9;
        --surface: #ffffff;
        --border: #e2e6ed;
        --text: #1a1d21;
        --muted: #5c6570;
        --muted-soft: #64748b;
        --accent: #2563eb;
        --accent-hover: #1d4ed8;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'IBM Plex Sans', sans-serif;
        background-color: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      .login-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 1rem;
        padding: 2.5rem;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 4px 6px -2px rgba(15, 23, 42, 0.04);
      }
      .brand-header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 2rem;
      }
      .brand-icon {
        width: 44px; height: 44px;
        background: var(--accent);
        border-radius: 12px;
        display: flex; align-items: center; justify-content: center;
        color: #fff; font-weight: 700; font-size: 1.35rem;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
      }
      .brand-title h1 { font-size: 1.35rem; font-weight: 700; color: #0f172a; }
      .brand-title p { font-size: 0.75rem; color: var(--muted-soft); margin-top: 0.1rem; }

      .form-group { margin-bottom: 1.25rem; }
      .form-group label {
        display: block;
        font-size: 0.8125rem;
        font-weight: 600;
        color: #334155;
        margin-bottom: 0.4rem;
      }
      .input-field {
        width: 100%;
        padding: 0.75rem 1rem;
        background: #ffffff;
        border: 1px solid #cbd5e1;
        border-radius: 0.5rem;
        color: #0f172a;
        font-size: 0.875rem;
        font-family: inherit;
        outline: none;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      .input-field:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
      }
      .btn-submit {
        width: 100%;
        padding: 0.75rem 1rem;
        background: var(--accent);
        color: #fff;
        font-weight: 600;
        font-size: 0.9375rem;
        border: none;
        border-radius: 0.5rem;
        cursor: pointer;
        transition: background 0.15s ease, transform 0.1s ease;
        margin-top: 0.5rem;
      }
      .btn-submit:hover { background: var(--accent-hover); }
      .btn-submit:active { transform: scale(0.99); }
      .error-alert {
        background: #fef2f2;
        border: 1px solid #fecaca;
        color: #ef4444;
        padding: 0.75rem;
        border-radius: 0.5rem;
        font-size: 0.8125rem;
        margin-bottom: 1.25rem;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <div class="brand-header">
        <div class="brand-icon">C</div>
        <div class="brand-title">
          <h1>Collectrr OS</h1>
          <p>MSME Loan Operations Platform</p>
        </div>
      </div>

      <div id="errorAlert" class="error-alert" hidden></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" class="input-field" placeholder="Enter your username" required autofocus />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div style="position: relative;">
            <input type="password" id="password" class="input-field" placeholder="Enter your password" style="padding-right: 2.75rem;" required />
            <button type="button" id="togglePasswordBtn" title="Toggle password visibility" style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 1rem; padding: 0.2rem;">👁️</button>
          </div>
        </div>
        <button type="submit" class="btn-submit" id="submitBtn">Sign In</button>
        <div style="text-align: center; margin-top: 1rem; font-size: 0.8125rem; color: var(--muted);">
          Don't have an account? <a href="/register.html" style="color: var(--accent); text-decoration: none; font-weight: 600;">Create one</a>
        </div>
      </form>
    </div>

    <script>
      const form = document.getElementById('loginForm');
      const errBox = document.getElementById('errorAlert');
      const submitBtn = document.getElementById('submitBtn');
      const passwordInput = document.getElementById('password');
      const togglePasswordBtn = document.getElementById('togglePasswordBtn');

      togglePasswordBtn.onclick = () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        togglePasswordBtn.textContent = isPassword ? '🙈' : '👁️';
      };

      form.onsubmit = async (e) => {
        e.preventDefault();
        errBox.hidden = true;
        submitBtn.disabled = true;
        submitBtn.textContent = 'Authenticating...';

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        try {
          // Verify credentials against auth API endpoint
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });

          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Invalid credentials');

          // Store session token in localStorage & redirect to dashboard
          localStorage.setItem('collectrr_auth', data.authHeader);
          
          const params = new URLSearchParams(window.location.search);
          const redirectUrl = params.get('redirect') || '/index.html';
          window.location.href = redirectUrl;
        } catch (err) {
          errBox.textContent = err.message;
          errBox.hidden = false;
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In';
        }
      };
    </script>
  </body>
</html>
